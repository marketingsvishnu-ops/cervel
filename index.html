<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motivation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: white;
      text-align: center;
    }

    .container {
      max-width: 700px;
      padding: 50px 30px;
    }

    h1 {
      font-size: 55px;
      margin-bottom: 20px;
    }

    h1 span {
      color: #ffd700;
    }

    p {
      font-size: 22px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    button {
      padding: 15px 30px;
      border: none;
      border-radius: 30px;
      background: #ffd700;
      color: #222;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
      background: white;
    }

    #quote {
      margin-top: 30px;
      font-size: 20px;
      font-style: italic;
      min-height: 30px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Believe in <span>You.</span></h1>

    <p>
      Don't wait for the perfect moment.<br>
      Take the moment and make it perfect.
    </p>

    <button onclick="showQuote()">Get Motivation</button>

    <div id="quote"></div>
  </div>

  <script>
    const quotes = [
      "Success starts with the decision to try.",
      "Small steps every day lead to big results.",
      "You are stronger than you think.",
      "Don't quit. Your future self will thank you.",
      "Dream big. Work hard. Stay consistent.",
      "Progress, not perfection."
    ];

    function showQuote() {
      const random = Math.floor(Math.random() * quotes.length);
      document.getElementById("quote").textContent = quotes[random];
    }
  </script>

</body>
</html>
